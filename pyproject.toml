[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "article-mvp"
version = "0.1.0"
description = "小黑盒发布响应捕获与指标采集单链路 MVP"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.0,<4.0.0",
    "SQLAlchemy>=2.0.36,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "playwright>=1.49.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "Pillow>=11.1.0,<12.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"article_mvp.platforms.xiaoheihe" = ["config.yaml"]
"article_mvp.web" = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/coreui/*",
    "static/vendor/coreui-icons/css/*",
    "static/vendor/coreui-icons/fonts/*",
    "static/vendor/gridstack/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
