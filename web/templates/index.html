{% extends "base.html" %}
{% block title %}仪表盘 - 自动化文章发布工具{% endblock %}
{% block header_title %}发布概览{% endblock %}
{% block content %}
<div x-data="dashboard" x-init="fetchData()" class="container">
    <div class="page-heading">
        <div><h1>发布概览</h1><p>查看跨平台发布任务状态与处理进度。</p></div>
        <div class="d-flex gap-2">
            <span class="badge bg-secondary fs-6" x-text="'队列: ' + status.queue_size"></span>
            <span class="badge bg-success fs-6" x-text="'运行中' " x-show="status.running"></span>
        </div>
    </div>

    <!-- 状态卡片 -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-primary">
                <div class="card-body text-center">
                    <h1 class="text-primary" x-text="tasks.length"></h1>
                    <small class="text-muted">总任务数</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-warning">
                <div class="card-body text-center">
                    <h1 class="text-warning" x-text="tasks.filter(t => t.status === 'queued' || t.status === 'processing' || t.status === 'retrying').length"></h1>
                    <small class="text-muted">进行中</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-success">
                <div class="card-body text-center">
                    <h1 class="text-success" x-text="tasks.filter(t => t.status === 'completed' || t.status === 'completed_with_warnings').length"></h1>
                    <small class="text-muted">草稿已保存</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-danger">
                <div class="card-body text-center">
                    <h1 class="text-danger" x-text="tasks.filter(t => t.status === 'failed').length"></h1>
                    <small class="text-muted">失败</small>
                </div>
            </div>
        </div>
    </div>

    <!-- 最近投递（新架构 delivery_operations）置顶显示 -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="cil-paper-plane me-1"></i>最近投递</h5>
            <button class="btn btn-sm btn-outline-secondary" @click="loadDeliveries">
                <i class="cil-reload me-1"></i>刷新
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>平台</th>
                        <th>账号</th>
                        <th>模式</th>
                        <th>状态</th>
                        <th>时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-if="deliveries.length === 0">
                        <tr>
                            <td colspan="6" class="empty-state">
                                <i class="cil-paper-plane fs-3 d-block mb-2"></i>
                                暂无投递记录，去 <a href="/upload">创作与投递</a>
                            </td>
                        </tr>
                    </template>
                    <template x-for="op in deliveries" :key="op.operation_id">
                        <tr>
                            <td><span class="badge bg-info" x-text="platformLabel(op.platform)"></span></td>
                            <td x-text="op.account_display_name || '-'"></td>
                            <td><span class="badge text-bg-secondary" x-text="op.mode === 'PUBLISH' ? '公开发布' : '平台草稿'"></span></td>
                            <td>
                                <span class="badge" :class="deliveryClass(op.status)" x-text="deliveryLabel(op.status)"></span>
                                <small class="d-block text-danger" x-show="op.error_code" x-text="op.error_code"></small>
                            </td>
                            <td><small class="text-muted" x-text="formatTime(op.created_at)"></small></td>
                            <td>
                                <a x-show="op.draft_url" :href="op.draft_url" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">
                                    <i class="cil-external-link"></i> 草稿箱
                                </a>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 任务列表（legacy 队列） -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">任务列表</h5>
            <button class="btn btn-sm btn-outline-secondary" @click="fetchData">
                <i class="cil-reload me-1"></i>刷新
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>文章</th>
                        <th>平台</th>
                        <th>标题</th>
                        <th>状态</th>
                        <th>重试</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-if="tasks.length === 0">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <i class="cil-inbox fs-3 d-block mb-2"></i>
                                暂无任务，去 <a href="/upload">上传文章</a>
                            </td>
                        </tr>
                    </template>
                    <template x-for="task in tasks" :key="task.id">
                        <tr>
                            <td x-text="task.id"></td>
                            <td>
                                <span class="text-truncate d-inline-block" style="max-width:150px"
                                      x-text="task.article_filename || '-'"></span>
                            </td>
                            <td>
                                <span class="badge bg-info" x-text="platformLabel(task.platform)"></span>
                            </td>
                            <td>
                                <span class="text-truncate d-inline-block" style="max-width:200px"
                                      x-text="task.title_used || '-'"></span>
                            </td>
                            <td>
                                <span class="badge" :class="statusClass(task.status)" x-text="statusLabel(task.status)"></span>
                            </td>
                            <td>
                                <small class="text-muted" x-text="task.retry_count + '/' + 3"></small>
                            </td>
                            <td>
                                <small class="text-muted" x-text="formatTime(task.created_at)"></small>
                            </td>
                            <td>
                                <a :href="'/task/' + task.id" class="btn btn-sm btn-outline-primary">
                                    <i class="cil-magnifying-glass"></i>
                                </a>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 最近投递（新架构 delivery_operations） -->
    <div class="card mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">最近投递</h5>
            <button class="btn btn-sm btn-outline-secondary" @click="loadDeliveries">
                <i class="cil-reload me-1"></i>刷新
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>平台</th>
                        <th>账号</th>
                        <th>模式</th>
                        <th>状态</th>
                        <th>时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-if="deliveries.length === 0">
                        <tr>
                            <td colspan="6" class="empty-state">
                                <i class="cil-paper-plane fs-3 d-block mb-2"></i>
                                暂无投递记录，去 <a href="/upload">创作与投递</a>
                            </td>
                        </tr>
                    </template>
                    <template x-for="op in deliveries" :key="op.operation_id">
                        <tr>
                            <td><span class="badge bg-info" x-text="platformLabel(op.platform)"></span></td>
                            <td x-text="op.account_display_name || '-'"></td>
                            <td><span class="badge text-bg-secondary" x-text="op.mode === 'PUBLISH' ? '公开发布' : '平台草稿'"></span></td>
                            <td>
                                <span class="badge" :class="deliveryClass(op.status)" x-text="deliveryLabel(op.status)"></span>
                                <small class="d-block text-danger" x-show="op.error_code" x-text="op.error_code"></small>
                            </td>
                            <td><small class="text-muted" x-text="formatTime(op.created_at)"></small></td>
                            <td>
                                <a x-show="op.draft_url" :href="op.draft_url" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">
                                    <i class="cil-external-link"></i> 草稿箱
                                </a>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 自动刷新 -->
    <div class="text-muted text-center mt-3">
        <small>每 5 秒自动刷新</small>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('dashboard', () => ({
        tasks: [],
        deliveries: [],
        status: { queue_size: 0, running: false },
        timer: null,

        async fetchData() {
            try {
                const [taskRes, statusRes] = await Promise.all([
                    fetch('/api/tasks'),
                    fetch('/api/status'),
                ]);
                this.tasks = await taskRes.json();
                this.status = await statusRes.json();
            } catch (e) {}
            await this.loadDeliveries();
        },

        async loadDeliveries() {
            try {
                const res = await fetch('/api/delivery-operations?limit=20');
                const payload = await res.json();
                this.deliveries = Array.isArray(payload.operations) ? payload.operations : [];
            } catch (e) {}
        },

        platformLabel(p) {
            const m = {
                zol: '中关村在线', xiaoheihe: '小黑盒', zhihu: '知乎', weibo: '微博',
                smzdm: '什么值得买', baijiahao: '百家号', xiaohongshu: '小红书',
                douyin: '抖音', toutiao: '头条号',
            };
            return m[p] || p;
        },

        deliveryLabel(s) {
            const m = {
                QUEUED: '已排队', RUNNING: '执行中', DRAFT_SAVED: '草稿已保存',
                DRAFT_SAVED_WITH_WARNINGS: '草稿已保存（图片未完整）',
                PUBLISHED: '已发布', PUBLISHED_WITH_WARNINGS: '已发布（图片未完整）',
                FAILED: '失败', RESULT_UNKNOWN: '结果未知',
                CONFIRMATION_REQUIRED: '待公开确认', BLOCKED: '已拦截',
            };
            return m[s] || s;
        },

        deliveryClass(s) {
            const m = {
                DRAFT_SAVED: 'bg-success', PUBLISHED: 'bg-success',
                DRAFT_SAVED_WITH_WARNINGS: 'bg-warning text-dark',
                PUBLISHED_WITH_WARNINGS: 'bg-warning text-dark',
                FAILED: 'bg-danger', RESULT_UNKNOWN: 'bg-warning text-dark',
                BLOCKED: 'bg-danger',
            };
            return m[s] || 'bg-light text-dark';
        },

        statusLabel(s) {
            const m = {
                queued: '排队中', processing: '处理中', completed: '已完成',
                completed_with_warnings: '草稿已保存（有警告）',
                failed: '失败', retrying: '重试中', cancelled: '已取消',
                paused: '已暂停', needs_selection: '待选择话题',
            };
            return m[s] || s;
        },

        statusClass(s) {
            const m = {
                queued: 'bg-secondary', processing: 'bg-warning text-dark',
                completed: 'bg-success', completed_with_warnings: 'bg-warning text-dark',
                failed: 'bg-danger', retrying: 'bg-info',
                paused: 'bg-warning text-dark', needs_selection: 'bg-warning text-dark',
            };
            return m[s] || 'bg-light text-dark';
        },

        formatTime(t) {
            return t ? t.replace('T', ' ').substring(0, 19) : '-';
        },

        init() {
            this.timer = setInterval(() => this.fetchData(), 5000);
        },
    }));
});
</script>
{% endblock %}
